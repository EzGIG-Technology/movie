<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>TAPIS Klasifikasi Filem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@800&display=swap">
<style>
/* Layout: photo header band (rounded bottom) with logo pill, glass nav and page hero; light airy surface below with frosted white glass cards overlapping the band. Modelled on the Sabah GO / SCANS consoles, recoloured for TAPIS/LPF (navy + teal). */
:root{
  color-scheme: light;
  --bg:#F5F8FD; --ink:#0D1B2A; --ink2:#43546A; --ink3:#5F7186; --line:#E1E8F0; --line2:#EDF2F7;
  --navy:#0A2463; --navy2:#0B2F7A; --teal:#1460E0; --teal2:#1E7BF2; --teal-ink:#0F4FC0; --sky:#E8F2FF; --maroon:#9F1525; --lpf-navy:#2b3643;
  --grad:linear-gradient(135deg,#0B2F7A 0%,#1460E0 55%,#22B5F0 100%);
  --gradBtn:linear-gradient(180deg,#2A7AF0 0%,#1460E0 100%);
  --glass:rgba(255,255,255,.64); --glassHi:rgba(255,255,255,.8); --glassEdge:rgba(255,255,255,.85);
  --glassShadow:0 1px 0 rgba(255,255,255,.9) inset,0 10px 30px rgba(16,56,140,.10),0 2px 6px rgba(16,56,140,.05);
  --glassShadow2:0 1px 0 rgba(255,255,255,.9) inset,0 22px 48px rgba(16,56,140,.16),0 4px 12px rgba(16,56,140,.07);
  --blur:blur(22px) saturate(180%);
  --ok:#0E8F57; --okBg:#E2F8EE; --warn:#B05400; --warnBg:#FFF0E0; --bad:#C81E45; --badBg:#FFE8EE; --violet:#5B3FC0; --violetBg:#EFEBFD; --info:#1460E0; --infoBg:#E8F2FF;
  --r-u:#0b84c6; --r-p12:#17a34a; --r-13:#e0b400; --r-16:#e07a10; --r-18:#c8102e;
  --font:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --mono:"Manrope", system-ui, sans-serif;
  --r:18px; --ease:cubic-bezier(.2,.8,.2,1);
  --fg:var(--ink); --text:var(--ink); --muted:var(--ink3); --muted-2:#8696A8; --surface:#fff; --surface-2:#F6F9FC; --border:var(--line); --border-2:#D5DFEA; --line-2:#D5DFEA;
  --ink-muted:var(--ink3); --ink-line:var(--line); --accent:var(--teal); --cyan:var(--teal); --cyan-600:var(--teal); --cyan-700:var(--teal-ink); --cyan-50:var(--sky);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;background:radial-gradient(1200px 600px at 100% 0%,rgba(20,96,224,.10),transparent 60%),radial-gradient(900px 600px at 0% 100%,rgba(11,35,64,.06),transparent 60%),linear-gradient(170deg,#F7FAFF,#F0F5FD 50%,#F8FBFF)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
.waves{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6;background:radial-gradient(1400px 260px at 50% 82%,transparent 60%,rgba(20,96,224,.10) 61%,transparent 62%),radial-gradient(1400px 260px at 40% 90%,transparent 60%,rgba(11,35,64,.06) 61%,transparent 62%),radial-gradient(1400px 260px at 60% 98%,transparent 60%,rgba(20,96,224,.08) 61%,transparent 62%)}
#app,#modalRoot,.toasts{position:relative;z-index:1}
a{color:var(--teal-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(20,96,224,.55);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
@media (max-width:700px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* ---------- photo band ---------- */
.band{position:relative;color:#fff;border-radius:0 0 40px 40px;overflow:hidden;background:var(--navy)}
.band-photo{position:absolute;inset:0}
.band-photo img{width:100%;height:100%;object-fit:cover;animation:kenburns 30s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08) translateX(-1.5%)}}
.band-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,26,48,.55) 0%,rgba(8,26,48,.3) 40%,rgba(10,36,99,.85) 100%),linear-gradient(90deg,rgba(8,26,48,.8) 0%,rgba(8,26,48,.15) 75%)}
.band-in{position:relative;padding-top:20px;padding-bottom:64px}
.topnav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-pill{display:inline-flex;align-items:center;gap:11px;background:#fff;color:var(--ink);border-radius:16px;padding:8px 14px 8px 8px;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.logo-pill b{display:block;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.08em;line-height:1.1}
.logo-pill small{display:block;font-size:11px;color:var(--ink3)}
.logo-pill .lsep{width:1px;height:28px;background:var(--line)}
.logo-pill img{height:26px;width:auto;display:block}
.tmark{display:inline-flex;align-items:center;justify-content:center;border-radius:28%;background:linear-gradient(135deg,#22B5F0,#1E7BF2 55%,#0B2F7A);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 16px rgba(20,96,224,.35);flex-shrink:0}
.tmark svg{margin-left:8%}
.navpills{display:flex;gap:4px;flex-wrap:wrap;padding:4px;border-radius:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.navpills a{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:rgba(255,255,255,.9);text-decoration:none;font-weight:600;font-size:13px;min-height:36px;white-space:nowrap}
.navpills a:hover{background:rgba(255,255,255,.14);color:#fff}
.navpills a[aria-current="page"]{background:#fff;color:var(--navy);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.navpills a[aria-current="page"] svg{color:var(--teal)}
.navpills .cnt{background:var(--maroon);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.meta{font-size:11.5px;color:rgba(255,255,255,.85);text-align:right;line-height:1.45;white-space:nowrap}
.uchip{display:inline-flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);text-align:left}
.uchip:hover{background:rgba(255,255,255,.22)}
.uchip b{display:block;font-size:12.5px;line-height:1.15}
.uchip small{display:block;font-size:11px;opacity:.85}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#22B5F0,#1E7BF2);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.band-hero{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:space-between;margin-top:40px}
.band-hero .bh-l{flex:1 1 520px;min-width:0}
.band-hero h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,4vw,50px);line-height:1.06;letter-spacing:-.03em;max-width:18ch}
.band-hero h1 em{font-style:normal;color:#8EC5FF}
.band-hero p{margin:12px 0 0;color:rgba(255,255,255,.9);font-size:15.5px;line-height:1.6;max-width:62ch}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#E3EEFF;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px 4px 8px;margin-bottom:14px;backdrop-filter:blur(10px)}
.kick i{width:7px;height:7px;border-radius:50%;background:#22B5F0;box-shadow:0 0 0 4px rgba(34,181,240,.25);animation:ping 2s ease-in-out infinite}
@keyframes ping{50%{box-shadow:0 0 0 8px rgba(34,181,240,0)}}
.bh-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.bh-stats{display:grid;grid-template-columns:repeat(2,minmax(150px,1fr));gap:12px;flex:0 1 430px}
.gstat{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.gstat b{display:block;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.gstat span{font-size:12px;color:rgba(255,255,255,.88)}
.content{position:relative;margin-top:-30px;padding-bottom:40px}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-block:18px 28px;font-size:12px;color:var(--ink3)}
@media (max-width:900px){.nav-r .meta{display:none}.band{border-radius:0 0 28px 28px}.band-hero{margin-top:26px}.navpills{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}}

/* ---------- glass cards ---------- */
.card,.dcard,.glass-card{background:var(--glass);border:1px solid var(--glassEdge);border-radius:var(--r);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glassShadow);color:var(--ink)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 0;flex-wrap:wrap}
.card-h h2,.card-h h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-b{padding:16px 20px 20px}
.eyebrow{font-size:12px;font-weight:600;color:var(--teal-ink);margin-bottom:4px;display:inline-flex;align-items:center;gap:6px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:40px 0 16px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.sec-h p{margin:6px 0 0;color:var(--ink3);max-width:72ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:12px;border:1px solid var(--border-2);background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:13.5px;white-space:nowrap;transition:background .15s,box-shadow .15s,transform .05s}
.btn:hover{background:#F4F8FB;border-color:#BFD0DF}
.btn:active{transform:translateY(1px)}
.btn-pri,.btn-cy{background:var(--gradBtn);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(20,96,224,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-pri:hover,.btn-cy:hover{background:linear-gradient(180deg,#3B8CF5,#1557D0);border-color:transparent}
.btn-w{background:#fff;color:var(--navy);border-color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.btn-w:hover{background:#F2F7FF}
.btn-gl{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(12px)}
.btn-gl:hover{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.5)}
.content .btn-gl,.modal .btn-gl{background:#fff;border-color:var(--border-2);color:var(--ink);backdrop-filter:none}
.btn-dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-dark:hover{background:var(--navy2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn-ghost:hover{background:rgba(16,56,140,.05)}
.btn-sm{min-height:32px;padding:5px 11px;font-size:12.5px;border-radius:9px}
.btn-lg{min-height:48px;padding:11px 18px;font-size:14.5px;border-radius:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.ibtn{width:32px;height:32px;min-height:32px;padding:0;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px;background:#EEF3F8;color:var(--ink2)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.st-Diserahkan,.sev-Rendah{background:#EEF3F8;color:#43546A}
.st-Pra-saringan{background:var(--infoBg);color:var(--info)}
.st-Menunggu,.sev-Sederhana{background:var(--warnBg);color:var(--warn)}
.st-Rujuk{background:var(--violetBg);color:var(--violet)}
.st-Diluluskan{background:var(--okBg);color:var(--ok)}
.sev-Tinggi{background:var(--badBg);color:var(--bad)}
.tag-x{background:var(--maroon);color:#fff}

/* rating badge, after LPF's classification marks */
.rb{display:inline-flex;flex-direction:column;align-items:center;color:#fff;font-weight:800;overflow:hidden;flex-shrink:0;width:var(--s,56px);height:var(--s,56px);font-family:"Inter",var(--font)}
.rb .k{width:100%;background:#111;color:#fff;font-size:calc(var(--s,56px)*.12);font-weight:700;letter-spacing:.03em;text-align:center;padding:16% 0 3%;line-height:1}
.rb .n{flex:1;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s,56px)*.42);line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.45);letter-spacing:-.02em}
.rb.p12 .n{font-size:calc(var(--s,56px)*.32)}
.rb.u{background:var(--r-u);border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.rb.p12{background:var(--r-p12);clip-path:polygon(50% 0,90% 19%,100% 62%,73% 100%,27% 100%,0 62%,10% 19%)}
.rb.r13{background:var(--r-13);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.rb.r16{background:var(--r-16);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.rb.r18{background:var(--r-18);border-radius:16%}
.rb.p12 .k,.rb.r13 .k,.rb.r16 .k{padding-top:27%;font-size:calc(var(--s,56px)*.105)}
.rb.u .k{padding-top:22%;font-size:calc(var(--s,56px)*.11)}
.rb.sm .k{display:none}
.rb.sm .n{font-size:calc(var(--s,56px)*.44)}
.rb.sm.p12 .n{font-size:calc(var(--s,56px)*.34)}

/* forms */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--ink)}
.field .hint{font-size:12px;color:var(--ink3)}
.inp{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--border-2);border-radius:12px;background:#fff;color:var(--ink)}
.inp::placeholder{color:#93A2B3}
.inp[readonly]{background:#F6F9FC}
textarea.inp{min-height:90px;resize:vertical}
.inp:focus{border-color:var(--teal2);outline:none;box-shadow:0 0 0 4px rgba(20,96,224,.15)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.err{color:var(--bad);font-size:12.5px;font-weight:600}

/* tables */
.tbl-box{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:12px;color:var(--ink3);text-align:left;font-weight:600;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tbody tr:hover td{background:rgba(20,96,224,.04)}

/* images */
.ph-img{position:relative;overflow:hidden;background:#DCE5EE}
.ph-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pfb{position:absolute;inset:0}
.thumb{width:72px;aspect-ratio:16/9;border-radius:10px;flex-shrink:0}
.pthumb{width:38px;aspect-ratio:2/3;border-radius:7px;flex-shrink:0}

/* ---------- login (master page) ---------- */
.lg-band .band-in{padding-bottom:120px}
.lg-band .band-hero{margin-top:46px}
.float-badges{position:absolute;right:6%;top:80px;width:360px;height:260px;pointer-events:none}
.float-badges .rb{position:absolute;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.filmstrip{position:absolute;left:0;right:0;bottom:28px;height:46px;overflow:hidden;opacity:.55;mask-image:linear-gradient(90deg,transparent,#000 15%,#000 85%,transparent)}
.filmstrip .fs{display:flex;gap:8px;width:max-content;animation:strip 40s linear infinite;padding:6px 0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 6px,transparent 6px 14px) top/100% 4px no-repeat,repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 6px,transparent 6px 14px) bottom/100% 4px no-repeat}
.filmstrip .fs span{width:62px;height:34px;border-radius:4px;flex-shrink:0}
@keyframes strip{to{transform:translateX(-50%)}}
.lg-main{position:relative;margin-top:-84px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px;align-items:start}
@media (max-width:920px){.lg-main{grid-template-columns:minmax(0,1fr)}.float-badges{display:none}}
.lg-list{padding:10px;display:flex;flex-direction:column;gap:4px}
.ropt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:10px 14px 10px 10px;border-radius:16px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink);transition:background .15s,border-color .15s}
.ropt:hover{background:rgba(255,255,255,.75)}
.ropt[aria-checked="true"]{background:rgba(20,96,224,.08);border-color:rgba(20,96,224,.5)}
.ropt .th{position:relative;width:96px;height:60px;border-radius:12px;flex-shrink:0;background:#CBD7E3}
.ropt .th > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px}
.ropt .crest{position:absolute;right:-8px;bottom:-8px;width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:0 4px 12px rgba(16,56,140,.2);display:flex;align-items:center;justify-content:center;color:var(--teal);overflow:hidden}
.ropt .crest img{width:25px;height:auto}
.ropt .grow{flex:1;min-width:0}
.ropt small{display:block;font-size:11.5px;color:var(--ink3)}
.ropt b{display:block;font-size:15px;font-weight:700}
.ropt .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #B9C7D6;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.ropt[aria-checked="true"] .radio{background:var(--teal);border-color:var(--teal)}
.lg-gov{background:rgba(222,231,240,.75);border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:4px;margin:4px 0}
.lg-gov .ropt{background:rgba(255,255,255,.8)}
.lg-gov .ropt[aria-checked="true"]{background:#EAF2FF}
.lg-gov-l{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--ink3);padding:4px 8px 2px}
.lg-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.lg-link{display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left;cursor:pointer}
.lg-link b{display:block;color:var(--teal-ink);font-size:13.5px}
.lg-link small{color:var(--ink3);font-size:12px}
.lg-panel{padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;background:var(--glassHi)}
.lg-ph{display:flex;align-items:center;gap:12px}
.lg-ph .ic{width:46px;height:46px;border-radius:13px;background:#EAF3F8;display:flex;align-items:center;justify-content:center;color:var(--teal);overflow:hidden;flex-shrink:0}
.lg-ph .ic img{width:34px}
.lg-ph small{display:block;font-size:11.5px;color:var(--ink3)}
.lg-ph b{display:block;font-size:19px;font-weight:700;font-family:var(--display)}
.steppill{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--teal-ink);background:var(--sky);border-radius:999px;padding:3px 10px;white-space:nowrap;align-self:flex-start}
.sample{background:#EEF3F8;border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--ink2)}
.lg-note{font-size:12.5px;color:var(--ink3);margin:0}
.lg-proto{font-size:12px;color:var(--ink3);text-align:center;border-top:1px solid var(--line);padding-top:12px;margin:0}
.otp{letter-spacing:.45em;font-family:var(--mono);font-size:20px;text-align:center}

/* ---------- process (motion) ---------- */
.proc{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;padding-top:6px}
.proc .track{position:absolute;left:7%;right:7%;top:44px;height:3px;border-radius:3px;background:linear-gradient(90deg,rgba(20,96,224,.18),rgba(20,96,224,.45),rgba(20,96,224,.18))}
.proc .track i{position:absolute;top:-4px;width:11px;height:11px;border-radius:50%;background:#1E7BF2;box-shadow:0 0 0 4px rgba(20,96,224,.18),0 0 14px #1E7BF2;animation:travel 12s linear infinite}
.proc .track i:nth-child(2){animation-delay:-4s}.proc .track i:nth-child(3){animation-delay:-8s}
@keyframes travel{from{left:0}to{left:100%}}
.pstep{position:relative;padding:16px;border-radius:var(--r);background:var(--glass);border:1px solid var(--glassEdge);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glassShadow);text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:stepglow 12s var(--ease) infinite;animation-delay:calc(var(--i) * 2s)}
@keyframes stepglow{0%,13%{transform:translateY(-6px);border-color:rgba(20,96,224,.7);box-shadow:var(--glassShadow2),0 0 0 4px rgba(20,96,224,.12)}17%,100%{transform:none}}
.pstep .pic{position:relative;width:60px;height:60px;border-radius:18px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 24px rgba(16,56,140,.3)}
.pstep .num{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--teal-ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pstep b{font-size:14px}
.pstep p{margin:0;font-size:12.5px;color:var(--ink3);line-height:1.5}
.pstep .mini{width:100%;height:30px;border-radius:9px;background:rgba(16,56,140,.05);position:relative;overflow:hidden;margin-top:auto}
.mini-up i{position:absolute;left:8px;right:8px;top:12px;height:6px;border-radius:4px;background:#E2EAF1;overflow:hidden}
.mini-up i::after{content:"";position:absolute;inset:0;width:0;background:var(--gradBtn);animation:fillup 3s ease-in-out infinite}
@keyframes fillup{0%{width:0}70%,100%{width:100%}}
.mini-lock::after{content:"AES-256 · tera air";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--teal-ink);font-family:var(--mono)}
.mini-lock::before{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(20,96,224,.25),transparent);animation:shine 2.4s linear infinite}
@keyframes shine{from{left:-40%}to{left:100%}}
.mini-ai{display:flex;align-items:center;justify-content:center;gap:3px;padding:0 6px}
.mini-ai span{width:9px;border-radius:2px;animation:eq 1.2s ease-in-out infinite}
@keyframes eq{0%,100%{height:6px}50%{height:22px}}
.mini-ok{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;color:var(--ok)}
.mini-ok .tick{width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;animation:pop 2.4s ease-in-out infinite}
@keyframes pop{0%,40%{transform:scale(.4);opacity:0}55%{transform:scale(1.15);opacity:1}70%,100%{transform:scale(1)}}
.mini-cert{display:flex;align-items:center;justify-content:center}
.mini-cert .rb{animation:stamp 2.4s ease-in-out infinite}
@keyframes stamp{0%,30%{transform:scale(1.8);opacity:0}45%{transform:scale(.9);opacity:1}55%,100%{transform:scale(1)}}
.mini-pub{display:flex;align-items:center;gap:6px;padding:0 8px;font-size:10.5px;color:var(--ink2)}
.mini-pub .caret{width:1.5px;height:14px;background:var(--teal);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:1100px){.proc{grid-template-columns:repeat(3,minmax(0,1fr))}.proc .track{display:none}}
@media (max-width:640px){.proc{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- AI brain ---------- */
.brainsec{position:relative;border-radius:28px;overflow:hidden;color:#fff;background:radial-gradient(900px 500px at 50% 45%,#123E8C 0%,#0B2340 55%,#081B4A 100%);box-shadow:var(--glassShadow2)}
.brainsec::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(142,197,255,.18) 1px,transparent 1.5px);background-size:26px 26px;mask-image:radial-gradient(ellipse at 50% 45%,#000 30%,transparent 75%)}
.brain-in{position:relative;padding:28px}
.brain-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-end}
.brain-head h2{font-family:var(--display);font-size:26px;font-weight:700}
.brain-head p{margin:6px 0 0;color:rgba(255,255,255,.82);max-width:66ch}
.brain-svg{overflow-x:auto;margin-top:10px}
.brain-svg svg{display:block;min-width:880px;width:100%;height:auto}
.flowline{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:4 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.neuron{animation:npulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes npulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
.synapse{stroke:rgba(255,255,255,.5);stroke-width:1;fill:none;stroke-dasharray:3 6;animation:dash 2s linear infinite}
.brain-glow{animation:bglow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bglow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.06)}}
.cat8 rect{animation:catblink 8s ease-in-out infinite;animation-delay:calc(var(--i) * 1s)}
@keyframes catblink{0%,8%{fill-opacity:.95}14%,100%{fill-opacity:.16}}
.packet{animation:pk 3s linear infinite}
.model-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.mchip{display:inline-flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px)}
.mchip .lw{width:34px;height:34px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px}
.mchip .lw img{max-width:100%;max-height:100%}
.mchip b{display:block;font-size:12.5px}
.mchip small{font-size:11px;color:rgba(255,255,255,.78)}
.brain-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}
.brain-steps div{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.brain-steps b{display:block;font-size:13px}
.brain-steps small{color:rgba(255,255,255,.8);font-size:12px}
.brain-steps .n{font-family:var(--mono);font-size:11px;color:#8EC5FF}

/* ---------- architecture ---------- */
.archsec{position:relative;border-radius:28px;overflow:hidden;color:#fff;background:var(--navy)}
.archsec .ab{position:absolute;inset:0}
.archsec .ab img{width:100%;height:100%;object-fit:cover;opacity:.45}
.archsec .ab::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,26,48,.86),rgba(10,30,80,.94))}
.arch-in{position:relative;padding:28px;display:flex;flex-direction:column;gap:6px}
.arch-in h2{font-family:var(--display);font-size:26px;font-weight:700}
.arch-in > p{margin:6px 0 14px;color:rgba(255,255,255,.82);max-width:70ch}
.layer{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:stretch;position:relative}
@media (max-width:760px){.layer{grid-template-columns:minmax(0,1fr)}}
.layer .ll{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;justify-content:center}

.layer .lc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.comp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.comp .ci{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#CFE3FF}

.layer.ai .ll{background:linear-gradient(135deg,rgba(20,96,224,.5),rgba(20,96,224,.15));border-color:rgba(142,197,255,.5)}
.layer.ai .comp{border-color:rgba(142,197,255,.45)}
.conn{height:26px;position:relative;margin-left:100px}
.conn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:rgba(142,197,255,.35)}
.conn i{position:absolute;left:-3px;width:8px;height:8px;border-radius:50%;background:#8EC5FF;box-shadow:0 0 10px #8EC5FF;animation:down 1.6s linear infinite}
.conn i:nth-child(2){animation-delay:-.8s}
@keyframes down{from{top:-4px;opacity:0}20%{opacity:1}to{top:22px;opacity:0}}
@media (max-width:760px){.conn{margin-left:20px}}
.arch-note{font-size:11.5px;color:rgba(255,255,255,.65);margin-top:10px}

/* ---------- home ---------- */

.qlist{display:flex;gap:6px;padding:10px;overflow-x:auto}

.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13.5px}

.gnum{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--gradBtn);color:#fff;font-size:11.5px;font-weight:800;flex-shrink:0;box-shadow:0 0 0 3px rgba(20,96,224,.18);animation:gp 2.4s ease-in-out infinite}
@keyframes gp{50%{box-shadow:0 0 0 7px rgba(20,96,224,0)}}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.guide div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.75);border:1px solid var(--line)}
.guide b{display:block;font-size:13px}
.guide small{display:block;font-size:12px;color:var(--ink3);line-height:1.45}
.player{border-radius:20px;overflow:hidden;background:#0A1018;box-shadow:0 24px 50px rgba(16,40,110,.25)}
.frame{position:relative;aspect-ratio:16/9;max-width:100%;background:#05080b;overflow:hidden;color:#e8edf2}
.frame .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.frame .sub{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:5px 12px;border-radius:8px;font-size:13px;color:#fff;max-width:80%;text-align:center}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;background:#101924;border-top:1px solid rgba(255,255,255,.08)}

.lanes{position:relative;padding:12px 14px;background:#0C141D;border-top:1px solid rgba(255,255,255,.08)}

@media (max-width:640px){.lane,.scenebar{grid-template-columns:22px minmax(0,1fr)}.lane .ln,.scenebar .sl{font-size:0}.ph-wrap{left:calc(14px + 22px + 10px)}.ticks{grid-template-columns:22px minmax(0,1fr)}.frame .wm,.frame .sim{display:none}}
tr.flag-on td,tr.scene-on td{background:rgba(20,96,224,.10)!important}

.why{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(20,96,224,.10),rgba(11,35,64,.04));border:1px solid rgba(20,96,224,.25)}
.rub td{vertical-align:top;font-size:13px}

.thr span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600}
.bar{height:7px;background:#E5ECF3;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:5px 10px;align-items:center}
.catrow .nm{font-size:12.5px;display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink2)}
.catrow .nm i{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.catrow .v{font-size:12.5px;font-weight:700;text-align:right}
.catrow .bar{grid-column:1 / -1}
.ring{--p:80;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--teal2) calc(var(--p)*1%),#E3EBF2 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring span{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;color:var(--ink)}
.rpills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rpill{border:1.5px solid var(--line);border-radius:13px;padding:8px 2px 6px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--ink3);min-width:0;line-height:1.2}
.rpill:hover{border-color:#BFD0DF}
.rpill[aria-pressed="true"]{border-color:var(--teal2);background:#EAF2FF;color:var(--teal-ink);box-shadow:0 0 0 3px rgba(20,96,224,.14)}
.ck{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;font-weight:600;color:var(--ink2)}
.ck:has(input:checked){border-color:#A9CBFF;background:#EAF2FF;color:var(--teal-ink)}
.ck input{width:15px;height:15px;accent-color:var(--teal);margin:0}
.cks{display:flex;flex-wrap:wrap;gap:7px}
.prog{width:100%;height:8px;background:#E3EBF2;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad);transition:width .2s linear;border-radius:6px}
.stepl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.stepl li{display:flex;gap:9px;align-items:center;color:var(--ink3)}
.stepl li.done{color:var(--ok)}
.stepl li.now{color:var(--ink);font-weight:700}
.scan{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:16px;overflow:hidden;background:#0A1018}
.scan img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6;filter:saturate(.7)}
.scan::after{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(180deg,transparent,rgba(34,181,240,.4),transparent);animation:scan 2.2s linear infinite}
@keyframes scan{from{top:-30%}to{top:100%}}
details.rubric summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px;font-weight:700;font-size:15px}
details.rubric summary::-webkit-details-marker{display:none}
details.rubric[open] summary .chev{transform:rotate(180deg)}

/* ---------- portal ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{padding:18px;display:flex;flex-direction:column;gap:6px}
.kpi .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{color:var(--ink3);font-size:12.5px;font-weight:600}
.kpi .ki{width:34px;height:34px;border-radius:11px;background:var(--sky);color:var(--teal);display:flex;align-items:center;justify-content:center}
.kpi b{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1;white-space:nowrap;letter-spacing:-.02em}
.kpi .dl{font-size:12px;color:var(--ink3)}
.kpi .up{color:var(--ok);font-weight:700}
.wz{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.wz{grid-template-columns:minmax(0,1fr)}}
.vsteps{list-style:none;margin:0;padding:8px;display:flex;flex-direction:column;gap:2px}
.vsteps li{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;font-weight:600;color:var(--ink3);font-size:13.5px}
.vsteps li b{width:28px;height:28px;border-radius:9px;background:#EEF3F8;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.vsteps li small{display:block;font-weight:500;font-size:11.5px;color:var(--ink3)}
.vsteps li.on{background:#fff;color:var(--ink);box-shadow:0 4px 14px rgba(16,56,140,.08)}
.vsteps li.on b{background:var(--gradBtn);color:#fff}
.vsteps li.done{color:var(--ink)}
.vsteps li.done b{background:var(--okBg);color:var(--ok)}
.drop{border:2px dashed #C6D4E2;border-radius:16px;padding:36px 24px;text-align:center;background:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;gap:10px}
.drop .di{width:56px;height:56px;border-radius:16px;background:var(--sky);color:var(--teal);display:flex;align-items:center;justify-content:center}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:#fff}
.opt:hover{border-color:#BFD0DF}
.opt:has(input:checked){border-color:var(--teal2);background:#EAF2FF}
.opt input{margin-top:3px;accent-color:var(--teal);width:16px;height:16px}
.sum{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px 16px;font-size:13.5px}
.sum .tot{font-weight:800;font-size:17px;border-top:1px solid var(--line);padding-top:12px}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.timeline li::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .d{width:24px;height:24px;border-radius:50%;background:#EEF3F8;border:2px solid #CBD7E3}
.timeline li.done .d{background:var(--ok);border-color:var(--ok)}
.timeline li.done::before{background:var(--ok)}
.timeline li.now .d{background:#fff;border-color:var(--teal2);box-shadow:0 0 0 4px rgba(20,96,224,.18)}
.timeline small{color:var(--ink3);display:block}
.seg-l{display:inline-flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:13px;padding:4px;gap:2px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.seg-l button{border:0;background:transparent;font-weight:600;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;color:rgba(255,255,255,.92);min-height:36px}
.seg-l button.on{background:#fff;color:var(--navy);box-shadow:0 4px 12px rgba(0,0,0,.15)}

/* ---------- dashboard ---------- */
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
@media (max-width:1100px){.span-7,.span-5,.span-6{grid-column:span 12}}
.hb{display:grid;grid-template-columns:130px minmax(0,1fr) 96px;gap:12px;align-items:center;margin-bottom:12px}
.hb .bar{height:10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut{width:176px;height:176px;border-radius:50%;position:relative;flex-shrink:0}
.donut span{position:absolute;inset:26px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 2px 8px rgba(16,56,140,.06)}
.donut b{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.donut small{color:var(--ink3);font-size:12px}
.log{list-style:none;margin:0;padding:0;font-size:13px}
.log li{display:grid;grid-template-columns:28px 110px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);align-items:center}
.log li:last-child{border-bottom:0}
.log .lic{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.log time{color:var(--ink3);font-family:var(--mono);font-size:11.5px}
@media (max-width:640px){.log li{grid-template-columns:28px minmax(0,1fr)}.log time{grid-column:2}}

/* ---------- public ---------- */
.psearch{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 16px;max-width:680px;box-shadow:0 12px 30px rgba(0,0,0,.2);color:var(--ink3);margin-top:20px}
.psearch input{border:0;outline:0;background:transparent;flex:1;min-width:0;min-height:52px;font-size:15.5px;color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.fbtn{min-height:34px;padding:5px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;backdrop-filter:blur(10px)}
.fbtn:hover{background:rgba(255,255,255,.22)}
.fbtn[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:#fff}
.fsel{min-height:34px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(11,35,64,.55);color:#fff;padding:5px 13px;font-weight:600;font-size:13px}
.prow-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:28px 0 14px}
.prow-h h2{font-family:var(--display);font-size:19px;font-weight:700}
.prow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,190px);gap:16px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px 16px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:0;border:0;background:transparent;cursor:pointer;color:var(--ink);scroll-snap-align:start}
.pcard .ph-img{aspect-ratio:2/3;max-width:100%;border-radius:16px;box-shadow:0 12px 26px rgba(16,40,110,.22);transition:transform .2s}
.pcard:hover .ph-img{transform:translateY(-4px)}
.pcard .ph-img .rb{position:absolute;right:9px;top:9px;z-index:2;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.pcard .ttl{position:absolute;left:8px;right:8px;bottom:8px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);color:#fff;font-weight:700;font-size:13.5px;line-height:1.25;z-index:1;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.pcard .m{font-size:12px;color:var(--ink3)}
.pcard .adv{font-size:12px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.code{background:#0B1622;color:#cfe3ef;font-family:var(--mono);font-size:12.5px;border-radius:14px;padding:16px;overflow-x:auto;white-space:pre;margin:0}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(11,35,64,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:max(32px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:rgba(255,255,255,.9);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glassEdge);border-radius:24px;width:min(820px,100%);box-shadow:var(--glassShadow2);overflow:hidden;color:var(--ink)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-family:var(--display);font-size:18px;font-weight:700}
.modal-b{padding:20px}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:10px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:rgba(255,255,255,.92);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:var(--glassShadow2);display:flex;gap:12px;align-items:center;font-size:13.5px;border:1px solid var(--glassEdge);animation:tin .25s ease-out}
.toast .ti{width:30px;height:30px;border-radius:10px;background:var(--sky);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast .btn{min-height:32px;padding:4px 11px}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* certificate */
.cert{border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:18px;background:#fff;color:#0f1720;position:relative;overflow:hidden;border:1px solid var(--line)}
.cert::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:linear-gradient(90deg,var(--maroon),var(--lpf-navy) 55%,var(--teal2))}
.cert-h{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px dashed #cdd6df}
.cert-h img{height:48px;width:auto}
.cert dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px 12px;margin:0;font-size:13.5px}
.cert dt{color:#5a6778}
.cert dd{margin:0;font-weight:600}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:sp .8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:32px;text-align:center;color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0s!important;animation-iteration-count:1!important;transition:none!important}}

.brain-svg text{font-family:var(--font)}
.mydid{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#21468F,#D12B2B);display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff}

/* typography: official serif headings, Manrope UI, tabular figures instead of monospace */
.mono,.tnum,#tcl,.frame .hud > span,.ticks .tt,.log time{font-variant-numeric:tabular-nums lining-nums}
.mono{letter-spacing:.01em;font-weight:600}
h1,h2,.band-hero h1,.sec-h h2,.brain-head h2,.arch-in h2,.fhead h1,.prow-h h2,.modal-h h2,.lg-ph b{font-weight:600!important;letter-spacing:-.012em!important}
.band-hero h1{font-size:clamp(32px,4.2vw,54px)!important;line-height:1.05!important}
.logo-pill b{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:16px}
.kpi b,.gstat b,.donut b{font-weight:600!important;letter-spacing:-.01em!important}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.brain-steps .n{font-family:var(--font);font-weight:800;letter-spacing:.14em;font-size:10.5px}
.frame .scene small{font-family:var(--font);font-weight:700;letter-spacing:.18em}
.frame .wm{font-family:var(--font);letter-spacing:.04em}
.code{font-family:var(--font);font-weight:500;line-height:1.7}
.otp{font-family:var(--font);font-weight:700;letter-spacing:.5em}
.flow .n,.lg-gov-l{letter-spacing:.12em}
.brain-svg text.title{font-family:var(--display)}

/* interactive architecture */
.aflows{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.afbtn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:13px;cursor:pointer;backdrop-filter:blur(12px)}
.afbtn:hover{background:rgba(255,255,255,.18)}
.afbtn[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:#fff}
.afbtn[aria-pressed="true"] svg{color:var(--teal)}
.agrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1100px){.agrid{grid-template-columns:minmax(0,1fr)}}
.asvg{overflow-x:auto;border-radius:20px;background:rgba(6,18,50,.35);border:1px solid rgba(255,255,255,.14)}
.asvg svg{display:block;width:100%;min-width:900px;height:auto}
.asvg text{font-family:var(--font)}
.alayer rect{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.08)}
.alayer .lt1{fill:#fff;font-size:13px;font-weight:700}
.alayer .lt2{fill:rgba(255,255,255,.6);font-size:11px}
.ae{fill:none;stroke:rgba(142,197,255,.28);stroke-width:1.4;transition:stroke .2s,opacity .2s}
.ae.dim{opacity:.12}
.ae.on{stroke:#8EC5FF;stroke-width:2.4;stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
.ae.cur{stroke:#FDE68A;stroke-width:3.2}
.an{cursor:pointer;transition:opacity .2s}
.an > rect:first-child{fill:rgba(255,255,255,.1);stroke:rgba(255,255,255,.28);stroke-width:1.2;transition:fill .2s,stroke .2s}
.an .aic{fill:rgba(255,255,255,.16)}
.an.ai > rect:first-child{stroke:rgba(142,197,255,.7);fill:rgba(30,123,242,.22)}
.an .t1{fill:#fff;font-size:13px;font-weight:700}
.an .t2{fill:rgba(255,255,255,.75);font-size:11px}
.an:hover > rect:first-child,.an:focus-visible > rect:first-child{fill:rgba(255,255,255,.2);stroke:#fff}
.an:focus{outline:none}
.an.on > rect:first-child{fill:rgba(255,255,255,.22);stroke:#8EC5FF;stroke-width:1.8}
.an.sel > rect:first-child{fill:#fff;stroke:#fff}
.an.sel .t1{fill:var(--navy)}.an.sel .t2{fill:var(--ink3)}.an.sel .aic{fill:var(--sky)}
.an.sel g{color:var(--teal)!important}
.an.dim{opacity:.28}
.an image{pointer-events:none}
.al rect{fill:rgba(10,36,99,.92);stroke:rgba(142,197,255,.6)}
.al text{fill:#CFE3FF;font-size:10.5px;font-weight:600}
.al.cur rect{fill:#FDE68A;stroke:#FDE68A}.al.cur text{fill:var(--navy);font-weight:800}
.apanel{padding:18px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.24);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
.apanel-h{display:flex;align-items:center;gap:12px}
.apanel-h small{display:block;font-size:11px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.apanel-h b{display:block;font-family:var(--display);font-size:18px;font-weight:600}
.ai-ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#CFE3FF}
.ai-ic.logo{background:#fff;padding:6px}.ai-ic.logo img{max-width:100%;max-height:100%}
.anarr{margin:0;color:rgba(255,255,255,.88);font-size:13.5px;line-height:1.6}
.hop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:13px}
.hop span{padding:5px 10px;border-radius:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24)}
.hop svg{color:#FDE68A}
.actl{display:flex;gap:8px;flex-wrap:wrap}
.asteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.asteps button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 9px;border-radius:10px;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.72);font-size:12.5px;cursor:pointer}
.asteps button span{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.14);display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex-shrink:0}
.asteps button.done{color:#fff}.asteps button.done span{background:#8EC5FF;color:var(--navy)}
.asteps button.on{background:rgba(253,230,138,.14);border-color:rgba(253,230,138,.5);color:#fff}.asteps button.on span{background:#FDE68A;color:var(--navy)}
.alist > span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.65);margin-bottom:6px}
.alist ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.alist li button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:7px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;cursor:pointer}
.alist li button:hover{background:rgba(255,255,255,.14)}

.mechsec{margin-top:40px;padding:26px;border-radius:28px;background:rgba(255,255,255,.74);border:1px solid var(--glassEdge);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--glassShadow2)}

.mnode rect,.mnode path,.mnode ellipse{fill:#fff;stroke:#D2DDEA;stroke-width:1.5}

.mnode .ms2{font-size:12px;fill:var(--ink3)}

.mhub .hub2{fill:rgba(255,255,255,.88);font-size:12px}
.ma{fill:none;stroke:#A3B5CB;stroke-width:2}
.mb{cursor:pointer}
.mb circle{fill:#fff;stroke:#1460E0;stroke-width:2}
.mb text{fill:#1460E0;font-size:13px;font-weight:800}
.mn{font-size:12px;fill:var(--ink3);font-weight:600}
.ma.ms{animation:maglow 27s infinite;animation-delay:calc(var(--i) * 3s)}
.mb.ms circle{animation:mbglow 27s infinite;animation-delay:calc(var(--i) * 3s)}
.mb.ms text{animation:mbtext 27s infinite;animation-delay:calc(var(--i) * 3s)}
.mn.ms{animation:mnglow 27s infinite;animation-delay:calc(var(--i) * 3s)}
@keyframes maglow{0%,10%{stroke:#1460E0;stroke-width:3.6}12%,100%{stroke:#A3B5CB;stroke-width:2}}
@keyframes mbglow{0%,10%{fill:#1460E0;r:18px}12%,100%{fill:#fff;r:15px}}
@keyframes mbtext{0%,10%{fill:#fff}12%,100%{fill:#1460E0}}
@keyframes mnglow{0%,10%{fill:#0A2463}12%,100%{fill:#5F7186}}
.mech-list{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.mech-list button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}

.mech-list li.ms button{animation:mlglow 27s infinite;animation-delay:calc(var(--i) * 3s)}

.mechsec:not([data-pin=""]) .ms,.mechsec:not([data-pin=""]) .ms circle,.mechsec:not([data-pin=""]) .ms text,.mechsec:not([data-pin=""]) .ms button{animation:none!important}
.mechsec:not([data-pin=""]) .ma{opacity:.35}
.ma.on{stroke:#1460E0!important;stroke-width:3.6!important;opacity:1!important;stroke-dasharray:8 6;animation:dash 1s linear infinite!important}
.mb.on circle{fill:#1460E0!important}.mb.on text{fill:#fff!important}

function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

function generatePlan(f) {
  const r = rng(hashStr(f.title + f.id));
  const prof = GENRES[f.genre] || {};
  const scores = {};
  CATS.forEach(c => { const rg = prof[c.k] || [0, 7]; scores[c.k] = Math.round(rg[0] + r() * (rg[1] - rg[0])); });
  const dur = f.min * 60;
  const flags = [];
  CATS.forEach(c => {
    const sc = scores[c.k]; if (sc < 14) return;
    const n = Math.max(1, Math.round(sc / 22));
    for (let i = 0; i < n; i++) {
      const s = Math.floor(dur * (0.04 + r() * 0.9));
      const len = 15 + Math.floor(r() * 110);
      const sv = sevOf(Math.max(8, sc - Math.floor(r() * 30)));
      const list = DESC[c.k];
      flags.push([s, Math.min(dur - 1, s + len), c.k, sv, +(0.62 + r() * 0.34).toFixed(2), list[Math.floor(r() * list.length)]]);
    }
  });
  flags.sort((a, b) => a[0] - b[0]);
  const rating = ratingFromScores(scores);
  return { scores, flags: mkFlags(flags), rating, conf: +(0.72 + r() * 0.22).toFixed(2), panel: (scores.agama >= 40 || scores.sensitif >= 40) };
}

function stChip(s) { return `<span class="chip st-${s.split(' ')[0]}"><span class="dot"></span>${s}</span>`; }

function catDot(k) { const c = CAT[k]; return `<span style="display:inline-flex;align-items:center;gap:7px;font-weight:600;white-space:nowrap"><i style="width:8px;height:8px;border-radius:2px;background:${c.c}"></i>${c.n}</span>`; }
function qr(seedStr, px = 120) {
  const n = 25, r = rng(hashStr(seedStr)); const cell = px / n; let out = '';
  const finder = (x, y) => (x >= 0 && x < 7 && y >= 0 && y < 7) ? ((x === 0 || x === 6 || y === 0 || y === 6) || (x >= 2 && x <= 4 && y >= 2 && y <= 4)) : null;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on = finder(x, y); if (on === null) on = finder(x - (n - 7), y); if (on === null) on = finder(x, y - (n - 7));
    const inF = (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
    if (on === null) on = inF ? false : r() > 0.52;
    if (on) out += `<rect x="${(x * cell).toFixed(2)}" y="${(y * cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}" fill="#0f1720"></rect>`;
  }
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" role="img" aria-label="Kod QR pengesahan (contoh)"><rect width="${px}" height="${px}" fill="#ffffff"></rect>${out}</svg>`;
}

};
const RANGE = { U: '0–17', P12: '18–33', '13': '34–51', '16': '52–75', '18': '76–100' };
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function scenesOf(f) {
  if (f._scenes) return f._scenes;
  const dur = f.min * 60; const r = rng(hashStr(f.id + 'scenes')); const out = []; let s = 0, i = 0;
  while (s < dur - 30) { const len = Math.min(dur - s, Math.round(200 + r() * 340)); out.push({ i, s, e: s + len }); s += len; i++; }
  const mult = { Tinggi: 1, Sederhana: .78, Rendah: .5 };
  out.forEach(sc => {
    const rr = rng(hashStr(f.id + ':' + sc.i)); sc.name = SCENES[Math.floor(rr() * SCENES.length)];
    sc.flags = f.ai.flags.filter(x => x.s < sc.e && x.e > sc.s);
    sc.scores = {};
    CATS.forEach(c => { const base = f.ai.scores[c.k] || 0; let v = Math.round(rr() * Math.min(10, base * .25));
      sc.flags.filter(x => x.cat === c.k).forEach(x => { v = Math.max(v, Math.round(base * mult[x.sev])); }); sc.scores[c.k] = v; });
    sc.rating = ratingFromScores(sc.scores);
    const keys = ['ganas', 'seks', 'bahasa', 'dadah', 'seram', 'bahaya'];
    sc.top = keys.reduce((a, k) => sc.scores[k] > sc.scores[a] ? k : a, keys[0]);
    sc.panel = sc.scores.agama >= 40 || sc.scores.sensitif >= 40;
  });
  Object.defineProperty(f, '_scenes', { value: out, enumerable: false, configurable: true });
  return out;
}

function sceneDetailHTML(f, sc) {

}

  const rev = { 'Pawagam': 184200, 'Penstriman (OTT)': 391500, 'Televisyen': 98400, 'Caj ekspres': 72600, 'Pra-semak AI': 18500 };

function openModal(title, body) {
  const root = document.getElementById('modalRoot');

  const b = root.querySelector('[data-act="close"]'); if (b) b.focus();
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function toast(msg, label, fn) {
  const box = document.getElementById('toasts'); const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="ti">${I.check}</span><span style="flex:1">${msg}</span>${label ? `<button class="btn">${label}</button>` : ''}`;
  if (label) el.querySelector('button').addEventListener('click', () => { el.remove(); fn && fn(); });
  box.appendChild(el); setTimeout(() => el.remove(), 7000);
}

// ---------- shared case helpers ----------
const ACTIVE_ST = ['Diserahkan', 'Pra-saringan AI', 'Menunggu Semakan', 'Rujuk Panel', 'Pindaan Diminta', 'Rayuan'];
function isActive(f) { return ACTIVE_ST.includes(f.status); }
function myTasks() { return S.films.filter(f => f.assignee === OFFICER && ['Menunggu Semakan', 'Rujuk Panel', 'Rayuan', 'Pra-saringan AI'].includes(f.status)).sort((a, b) => daysLeft(a) - daysLeft(b)); }
function slaChip(f) {
  if (!isActive(f)) return '';
  if (['Pindaan Diminta', 'Rayuan', 'Rujuk Panel'].includes(f.status)) return `<span class="chip sla-p">${I.clock}SLA dijeda</span>`;
  const d = daysLeft(f); const cls = d < 0 ? 'sla-bad' : d <= 1 ? 'sla-warn' : 'sla-ok';
  return `<span class="chip ${cls}">${I.clock}${d < 0 ? `Lewat ${-d} hari` : d === 0 ? 'Akhir hari ini' : d === 1 ? 'Esok' : `${d} hari lagi`}</span>`;
}
function asg(n) { return n ? `<span class="asg"><span class="av2">${initials(n)}</span>${esc(n)}</span>` : '<span class="chip st-Menunggu">Belum ditugaskan</span>'; }
function kindChip(f) {
  if (!f.decision) return '';
  const k = f.decision.kind; return k === 'tolak' ? '<span class="chip st-Ditolak">Ditolak</span>' : k === 'potong' ? `<span class="chip st-Pindaan">Lulus · ${f.decision.cuts.length} potongan</span>` : '<span class="chip st-Diluluskan">Lulus penuh</span>';
}
function resultCell(f) { return f.decision ? (f.decision.kind === 'tolak' ? '<span class="rej-b">TIDAK<br>LULUS</span>' : badge(f.decision.rating, 30, true)) : '<span class="muted">—</span>'; }
function stChipX(f) {
  if (f.status === 'Pra-saringan AI') return `<span class="chip st-Pra-saringan">${f.ai.running ? '<span class="spin"></span>' : ''}${f.ai.running ? `AI <span data-progtxt="${f.id}">${Math.round(f.ai.progress)}</span>%` : f.ai.queued ? `Giliran GPU #${f.ai.queued}` : 'Pra-saringan AI'}</span>`;
  if (f.status === 'Menunggu Semakan' && f.resubmitted) return '<span class="chip st-Menunggu"><span class="dot"></span>Versi disunting</span>';
  return stChip(f.status);
}
function timelineOf(f) {
  const ev = []; const s = f.submitted; const add = (at, t, d, who, fut) => ev.push({ at, t, d, who, fut: fut || new Date(at) > new Date() });
  add(s, f.status === 'Draf' ? 'Draf dicipta' : 'Serahan dihantar', `${f.type} · ${f.min} minit · ${f.platform}`, f.dist);
  if (f.status === 'Draf') return ev;
  if (f.status === 'Menunggu Bayaran') { add(s, 'Menunggu bayaran', `Invois ${rm(fee(f))} dikeluarkan`, 'Sistem'); return ev; }
  add(addDays(s, 0.003), 'Bayaran diterima', `${rm(fee(f))} melalui FPX · resit ${receiptNo(f)}`, 'Sistem');
  add(addDays(s, 0.02), 'Fail disahkan & disulitkan', 'Checksum SHA-256 · AES-256 · tera air forensik', 'Sistem');
  if (f.ai.done) add(addDays(s, 0.12), 'Pra-saringan AI selesai', `Cadangan ${f.ai.rating} · ${f.ai.flags.length} penanda · keyakinan ${Math.round(f.ai.conf * 100)}%`, 'Otak AI KDN');
  else if (f.status === 'Pra-saringan AI') add(addDays(s, 0.01), 'Dalam pra-saringan AI', f.ai.queued ? `Giliran pemprosesan #${f.ai.queued}` : 'Sedang dianalisis', 'Otak AI KDN');
  if (f.assignee) add(addDays(s, 0.16), 'Ditugaskan', `Kepada ${f.assignee}`, 'Pengurusan LPF');
  if (f.panel) { add(addDays(s, 1.2), 'Dirujuk kepada panel', `${f.panel.name}: ${f.panel.reason}`, f.panel.by); add(f.panel.at, `Sesi ${f.panel.name}`, 'Tontonan bersama dan keputusan panel', 'LPF'); }
  if (f.request) { add(f.request.at, 'Pindaan diminta', `${f.request.cuts.length} potongan untuk kelulusan ${f.request.rating}`, f.request.by); if (!f.resubmitted && f.status === 'Pindaan Diminta') add(f.request.due, 'Tarikh akhir versi disunting', 'Serahan ditutup jika tiada respons', 'Sistem'); }
  if (f.resubmittedAt) add(f.resubmittedAt, 'Versi disunting diterima', 'Sedia untuk pengesahan potongan', f.dist);
  if (f.decision) {
    const d = f.decision;
    if (d.kind === 'tolak') add(d.at, 'Tidak diluluskan', `Kod ${d.code}: ${(REJECT.find(r => r[0] === d.code) || ['', ''])[1]}`, d.by);
    else { add(d.at, `Diluluskan · ${d.rating}`, d.kind === 'potong' ? `Dengan ${d.cuts.length} potongan` : 'Tanpa potongan', d.by); add(addDays(d.at, 0.001), 'Sijil digital dijana', f.cert, 'Sistem'); }
  }
  if (f.appeal) { add(f.appeal.at, 'Rayuan difailkan', f.appeal.grounds, f.dist); add(f.appeal.hearing, 'Pendengaran Jawatankuasa Rayuan', f.appeal.status, 'LPF'); }
  return ev.sort((a, b) => new Date(a.at) - new Date(b.at));
}
function receiptNo(f) { return 'RS' + f.id.slice(-4) + String(hashStr(f.id) % 9000 + 1000); }
function timelineHTML(f) {
  return `<ol class="tl2">${timelineOf(f).map(e => `<li class="${e.fut ? 'fut' : ''}"><span class="d"></span><div><b>${esc(e.t)}</b><small>${fmtDate(e.at)} · ${fmtTime(e.at)} · ${esc(e.who)}${e.fut ? ' · dijadualkan' : ''}</small>${e.d ? `<p>${esc(e.d)}</p>` : ''}</div></li>`).join('')}</ol>`;
}
function cutsHTML(cuts) { return `<ol class="cuts">${cuts.map((c, i) => `<li><span class="cn">${i + 1}</span><span class="mono tnum">${tc(c.s)}–${tc(c.e)}</span><span>${esc(c.d)}</span></li>`).join('')}</ol>`; }

      ${f.request && f.status !== 'Diluluskan' ? `<div><div class="lbl" style="margin-bottom:8px">Pindaan diminta (untuk ${f.request.rating})</div>${cutsHTML(f.request.cuts)}</div>` : ''}
      ${f.ai.done ? `<div class="aisum"><div style="display:flex;gap:12px;align-items:center">${badge(f.ai.rating, 40, true)}<div><b>Cadangan AI: ${f.ai.rating}</b><div class="muted" style="font-size:12.5px">${f.ai.flags.length} penanda · keyakinan ${Math.round(f.ai.conf * 100)}%${d && d.kind !== 'tolak' ? ` · ${d.agreed ? 'selari dengan keputusan' : 'dipinda oleh pegawai'}` : ''}</div></div></div>
        <div class="mini8">${CATS.map(c => { const v = f.ai.scores[c.k] || 0; return `<span title="${c.n}: ${v}"><i style="height:${Math.max(4, v)}%;background:${c.c}"></i><small>${CAT_SHORT[c.k]}</small></span>`; }).join('')}</div></div>` : ''}

function oBoard() {

  const myDec = S.films.filter(f => f.decision && f.decision.by === OFFICER).sort((a, b) => new Date(b.decision.at) - new Date(a.decision.at));
  const agreeD = myDec.filter(f => f.decision.kind !== 'tolak'); const agreeN = agreeD.filter(f => f.decision.agreed).length;
  const un = S.films.filter(f => f.status === 'Menunggu Semakan' && !f.assignee);
  const sched = [];
  S.films.forEach(f => { if (f.panel && f.status === 'Rujuk Panel') sched.push([f.panel.at, `Sesi ${f.panel.name}`, f]); if (f.appeal && f.status === 'Rayuan') sched.push([f.appeal.hearing, 'Jawatankuasa Rayuan', f]); if (f.assignee === OFFICER && f.status === 'Menunggu Semakan') sched.push([dueOf(f), 'Tarikh akhir SLA', f]); });
  sched.sort((a, b) => new Date(a[0]) - new Date(b[0]));
  return `<div class="kpis">

// ---------- AI jobs ----------
function startAI(id) {
  const f = film(id); if (!f || f.ai.done || jobs[id]) return;
  if (!f.ai.plan) f.ai.plan = generatePlan(f);
  f.ai.running = true; f.status = 'Pra-saringan AI'; save();
  jobs[id] = setInterval(() => {
    f.ai.progress = Math.min(100, f.ai.progress + 1.8 + Math.random() * 2.2);
    const p = Math.round(f.ai.progress);
    document.querySelectorAll(`[data-prog="${id}"]`).forEach(e => e.style.width = p + '%');
    document.querySelectorAll(`[data-progtxt="${id}"]`).forEach(e => e.textContent = p);
    document.querySelectorAll(`[data-steps="${id}"]`).forEach(e => e.innerHTML = stepsHTML(p));
    if (f.ai.progress >= 100) finishAI(f);
  }, 160);
}
function finishAI(f) {
  clearInterval(jobs[f.id]); delete jobs[f.id];
  const p = f.ai.plan;
  f.ai = { done: true, running: false, progress: 100, rating: p.rating, conf: p.conf, scores: p.scores, flags: p.flags, panel: p.panel };
  f.status = 'Menunggu Semakan';
  if (!ui.dec[f.id]) ui.dec[f.id] = newDec(f);
  addLog('Sistem', `Pra-saringan AI selesai bagi «${f.title}»: ${p.flags.length} penanda, cadangan ${p.rating}`);
  save();
  if (S.role !== 'pengedar') toast(`Pra-saringan AI selesai: «${esc(f.title)}», cadangan ${p.rating}.`, ui.route === 'pegawai' && ui.sel === f.id ? null : 'Buka', () => A.openfilm({ dataset: { id: f.id } }));
  safeRender();
}
function safeRender() {
  const a = document.activeElement;

  if (ui.route === 'pengedar' && ui.dtab === 'baru' && ui.wizStep < 5) return;
  if (document.getElementById('modalRoot').innerHTML) return;
  render();
}
